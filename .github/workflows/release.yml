name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single file
        run: |
          dotnet publish SortDemo/SortDemo.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Create zip archive
        run: Compress-Archive -Path publish/SortDemo.exe -DestinationPath SortDemo-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SortDemo ${{ github.ref_name }}
          body: |
            ## Sorting Algorithm Visualizer ${{ github.ref_name }}

            ### Download
            - **SortDemo.exe** - Standalone executable (no .NET runtime needed)
            - **SortDemo-${{ github.ref_name }}-win-x64.zip** - Zipped version

            ### What's included
            - 14 sorting algorithms with visual animation and sound
            - Race mode for side-by-side algorithm comparison
            - Speed and bar count controls
            - Dark theme UI

            ### Requirements
            - Windows 10/11 (x64)
          files: |
            publish/SortDemo.exe
            SortDemo-${{ github.ref_name }}-win-x64.zip
