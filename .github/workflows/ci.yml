name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SortDemo/SortDemo.csproj

      - name: Build
        run: dotnet build SortDemo/SortDemo.csproj -c Release --no-restore -warnaserror

      - name: Lint with dotnet format
        run: dotnet format SortDemo/SortDemo.csproj --verify-no-changes --severity warn

      - name: Restore test dependencies
        run: dotnet restore SortDemo.Tests/SortDemo.Tests.csproj

      - name: Build tests
        run: dotnet build SortDemo.Tests/SortDemo.Tests.csproj -c Release --no-restore

      - name: Run tests
        run: dotnet test SortDemo.Tests/SortDemo.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
